name: Deploy to WordPress.org SVN

# Manual only. Renegade is distributed through GitHub Releases (release.yml),
# so version tags must not trigger a WordPress.org deploy. Run this by hand
# if the plugin is ever submitted to the WordPress.org directory — and build
# that package with CLOCKWORK_RENEGADE_DISABLE_SELF_UPDATE defaulting to true.
on:
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to WordPress.org
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: WordPress Plugin Deploy
        uses: 10up/action-wordpress-plugin-deploy@stable
        with:
          generate-zip: true
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: clockwork-renegade
