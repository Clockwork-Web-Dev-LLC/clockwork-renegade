name: Release

# Push a tag like v1.1.0 to publish a GitHub Release. Installed copies of the
# plugin (see src/Updates/SelfUpdater.php) discover updates from the latest
# non-prerelease release and download the clockwork-renegade.zip asset.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify tag matches plugin version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          HEADER=$(grep -m1 -E '^ \* Version:' clockwork-renegade.php | sed -E 's/.*Version:[[:space:]]*//')
          CONST=$(grep -m1 "define('CLOCKWORK_RENEGADE_VERSION'" clockwork-renegade.php | sed -E "s/.*'([0-9][^']*)'\);.*/\1/")
          STABLE=$(grep -m1 '^Stable tag:' readme.txt | sed -E 's/Stable tag:[[:space:]]*//')
          echo "tag=$TAG header=$HEADER const=$CONST stable=$STABLE"
          if [ "$TAG" != "$HEADER" ] || [ "$TAG" != "$CONST" ] || [ "$TAG" != "$STABLE" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the plugin version header, constant, and readme Stable tag."
            exit 1
          fi

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Run test suite
        run: |
          composer install --prefer-dist --no-progress
          ./vendor/bin/phpunit

      - name: Build release zip
        run: ./bin/build-release-zip.sh

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/clockwork-renegade.zip \
            dist/clockwork-renegade.zip.sha256 \
            --title "Clockwork Renegade ${GITHUB_REF_NAME#v}" \
            --generate-notes
